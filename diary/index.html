@media (prefers-reduced-motion:reduce){.leaf{transition:none}}

function readAuthHash(){

  const h=new URLSearchParams(location.hash.slice(1));
  if(!h.get('access_token')&&!h.get('error'))return null;

/* 화면 뒤 숨은 창으로 새 토큰 받기. 숨은 창 안에서는 <head>의 짧은 스크립트가 결과만 넘겨준다 */
function silentFrame(){
  return new Promise(res=>{
    const st='f'+rnd();let done=false,tm=null,fr=null;
    const fin=r=>{if(done)return;done=true;clearTimeout(tm);removeEventListener('message',onMsg);try{fr.remove()}catch(e){}res(r)};
    const onMsg=e=>{
      if(e.origin!==location.origin||!fr||e.source!==fr.contentWindow)return;
      const d=e.data;if(!d||d.t!=='d27auth'||typeof d.hash!=='string')return;
      const h=new URLSearchParams(d.hash.replace(/^#/,''));
      if(h.get('state')!==st)return fin({ok:false,err:'state'});
      if(h.get('error'))return fin({ok:false,err:h.get('error')});
      if(!h.get('access_token'))return fin({ok:false,err:'empty'});
      saveToken(h);fin({ok:true});
    };
    addEventListener('message',onMsg);
    fr=document.createElement('iframe');
    fr.setAttribute('aria-hidden','true');fr.tabIndex=-1;
    fr.style.cssText='position:fixed;left:-9999px;top:0;width:10px;height:10px;border:0;visibility:hidden';
    tm=setTimeout(()=>fin({ok:false,err:'timeout'}),6000);
    fr.src=authUrl(st,true);
    document.body.appendChild(fr);
  });
}
let renewP=null;
function renew(){
  if(renewP)return renewP;
  renewP=(async()=>{
    if(!navigator.onLine)return {ok:false,err:'offline'};
    const r=await silentFrame();
    logAuth('frame',r.ok,r.err);
    if(r.ok){LS.set('silentMode','frame');LS.del('needLogin')}
    return r;
  })();
  renewP.then(()=>{renewP=null},()=>{renewP=null});
  return renewP;
}
/* 구글까지 통신이 되는지(응답이 없었던 까닭이 통신 문제인지 가리려고) */
async function reachable(){
  try{const c=new AbortController(),t=setTimeout(()=>c.abort(),4000);await fetch('https://www.gstatic.com/generate_204',{mode:'no-cors',cache:'no-store',signal:c.signal});clearTimeout(t);return true}catch(e){return false}
}
/* 조용한 연장이 실패했을 때: 가능하면 화면이 잠깐 다녀오고, 아니면 '다시 연결' 안내 */
async function lost(r){
  const e=r&&r.err;
  if(e==='offline'){setAuth('off');return 'off'}
  if(canBounce()&&document.visibilityState==='visible'){
    if(e==='timeout'&&!(await reachable())){setAuth('off');return 'off'}   // 통신이 안 될 때는 화면을 옮기지 않는다
    if(quiet()&&!tokenValid()){startAuth(true);return 'bounce'}
  }
  if(tokenValid()){setAuth('ok');return 'ok'}
  setAuth('need',e);return 'need';
}
async function getToken(){
  let t=tokenValid();if(t){if(AUTH.st!=='ok')setAuth('ok');return t}
  if(!LS.get('hadLogin')){setAuth('none');throw {code:'auth'}}
  if(AUTH.st==='need')throw {code:'auth'};
  const r=await renew();
  t=tokenValid();if(t){setAuth('ok');return t}
  const w=await lost(r);
  if(w==='ok')return tokenValid();
  throw {code:w==='off'?'network':'auth'};
}
/* 앱을 열 때·돌아올 때: 토큰이 없으면 조용히 받아 본다 */
async function connect(){
  if(tokenValid()){setAuth('ok');return true}
  if(!LS.get('hadLogin')){setAuth('none');return false}
  if(!navigator.onLine){setAuth('off');return false}
  if(AUTH.st!=='need')setAuth('renew');
  const r=await renew();
  if(tokenValid()){setAuth('ok');return true}
  return (await lost(r))==='ok';
}

async function gfetch(url,opt,again){
  const tk=await getToken();
  const o=Object.assign({},opt||{});o.headers=Object.assign({'Authorization':'Bearer '+tk},o.body?{'Content-Type':'application/json'}:{});
  let r;try{r=await fetch(url,o)}catch(e){throw {code:'network',message:String(e&&e.message||e)}}
  if(r.status===401){LS.del('token');if(!again)return gfetch(url,opt,true);setAuth('need','401');throw {code:'auth'}}
  if(!r.ok){let m='';try{const j=await r.json();m=(j.error&&j.error.message)||''}catch(e){}throw {code:r.status===403?'forbidden':r.status===429?'rate_limited':'http',status:r.status,message:m,retryable:r.status>=500||r.status===429}}
  if(r.status===204)return {};
  const tx=await r.text();return tx?JSON.parse(tx):{};
}

      fields:'nextPageToken,items('+EVF+(LS.get('hint')?'':',organizer(email,self)')+')'});
    if(input.pageToken)q.set('pageToken',input.pageToken);
    const r=await gfetch(GCAL+encodeURIComponent(input.calendarId||'primary')+'/events?'+q.toString());
    return {events:r.items||[],nextPageToken:r.nextPageToken};
  }
  if(tool==='update_event'){
    const b={summary:input.summary};const c=colorFor(input.summary);if(c)b.colorId=c;
    return gfetch(GCAL+'primary/events/'+encodeURIComponent(input.eventId)+'?sendUpdates=none&fields='+EVF,{method:'PATCH',body:JSON.stringify(b)});
  }
  if(tool==='create_event'){
    const b={summary:input.summary};if(input.description)b.description=input.description;
    if(input.allDay){b.start={date:input.startTime.slice(0,10)};b.end={date:input.endTime.slice(0,10)};b.transparency='transparent'}
    else{b.start={dateTime:input.startTime,timeZone:'Asia/Seoul'};b.end={dateTime:input.endTime,timeZone:'Asia/Seoul'}}
    const c=colorFor(input.summary);if(c)b.colorId=c;
    return gfetch(GCAL+'primary/events?sendUpdates=none&fields='+EVF,{method:'POST',body:JSON.stringify(b)});
  }
  throw {code:'http',message:'알 수 없는 요청'};
}

function parseTab(ds,vals){
  const t=STAB[ds],hdr=(vals[0]&&vals[0].length)?vals[0].map(String):t.cols.map(x=>x[0]),known={};
  t.cols.forEach(([h,k])=>{known[h]=k||h});
  const rows=[];
  for(let i=1;i<vals.length;i++){
    const v=vals[i];if(!v||!v.length)continue;
    const o={_row:i+1};t.cols.forEach(([h,k])=>{o[k||h]=''});
    hdr.forEach((h,j)=>{const x=v[j]!=null?String(v[j]):'';if(known[h])o[known[h]]=x;else if(x)o['x:'+h]=x});   // 직접 추가한 열도 보존
    if(!o.id)continue;o.url=o.id;rows.push(o);
  }
  return {hdr,rows};
}
function cellVal(v){if(v==null)return '';if(Array.isArray(v))return JSON.stringify(v);return String(v)}

/* 다섯 탭을 한 번의 요청으로 받아 온다. 내용이 그대로면 화면을 다시 그리지 않는다 */
function syncTables(force){
  if(tblP)return tblP;
  if(!force&&tblAt&&Date.now()-tblAt<TBL_TTL)return Promise.resolve(false);
  busy.add('tbl');syncDot();
  const w0=wseq,names=Object.keys(STAB),url=id=>SHEETS+id+'/values:batchGet?'+names.map(k=>'ranges='+rng(STAB[k].name,'A:Z')).join('&');
  tblP=(async()=>{
    try{
      let id=await gsheet(),r;
      try{r=await gfetch(url(id))}
      catch(e){
        if(e.status===404){forgetSheet();id=await gsheet();r=await gfetch(url(id))}
        else if(e.status===400&&await repairSheet(id))r=await gfetch(url(id));
        else throw e;
      }
      const vr=names.map((k,i)=>((r.valueRanges||[])[i]||{}).values||[]);
      const fix=names.filter((k,i)=>!(vr[i][0]&&vr[i][0].length));   // 첫 줄 제목이 비어 있는 탭
      if(fix.length){await gfetch(SHEETS+id+'/values:batchUpdate',{method:'POST',body:JSON.stringify({valueInputOption:'RAW',data:hdrData(fix.map(k=>STAB[k]))})});fix.forEach(k=>{vr[names.indexOf(k)][0]=STAB[k].cols.map(c=>c[0])})}
      if(writing||wseq!==w0){tblAt=0;setTimeout(()=>syncTables(),1500);return false}   // 받는 사이 저장이 있었으면 버리고 다시 받는다
      const sig=hash(JSON.stringify(vr));
      tblAt=lastSync=Date.now();ERR.no=null;
      if(sig===tblSig)return false;
      tblSig=sig;
      names.forEach((k,i)=>{
        if(k==='conf'){for(const x in CONF)delete CONF[x];vr[i].slice(1).forEach(v=>{if(v&&v[0])CONF[v[0]]=v[1]==null?'':String(v[1])})}
        else TBL[k]=parseTab(k,vr[i]);
      });
      applyConf();tblChanged();
      return true;
    }catch(e){
      const show=e.code!=='auth'&&!(e.code==='network'&&TBL.daily);
      if(show)ERR.no=e;
      return show;
    }finally{tblP=null;busy.delete('tbl');syncDot()}
  })();
  tblP.then(ch=>{if(ch)render()});
  return tblP;
}

function classify(e,cal){
  const allDay=!!(e.start&&e.start.date);
  const start=allDay?pYmd(e.start.date):new Date(e.start&&e.start.dateTime);
  let end=allDay?pYmd((e.end&&e.end.date)||e.start.date):new Date((e.end&&e.end.dateTime)||(e.start&&e.start.dateTime));
  const raw=e.summary||'(제목 없음)';let t=raw.trim(),title,area='개인',act='',tag='',explicit=false,done=false;
  if(/^✔/.test(t)){done=true;t=t.replace(/^✔\s*/,'')}
  title=t;
  if(cal==='h'){area='휴일'}
  else if(cal==='f'){area='개인';act='가족';tag='가족'}
  else{
    const m=title.match(/^\[(대신|선우|메트|개인|미분류)(?:\s*[·\/.・ㆍ]\s*([^\]]+))?\]\s*/);
    if(m){area=m[1];act=(m[2]||'').trim();title=title.slice(m[0].length);explicit=area!=='미분류'}
    const k=title.match(/^\s*✔?\s*\[카톡\]\s*/);
    if(k){tag='카톡';title=title.slice(k[0].length);if(!explicit&&area!=='미분류')area='대신';if(!act)act='카톡 회신'}
    else if(!explicit&&area!=='미분류'){
      const lb=title.match(/^\[([^\]]+)\]\s*/);
      if(lb){const n=lb[1];title=title.slice(lb[0].length);
        if(/골프/.test(n)&&!/후쿠오카|여행/.test(n)){area='개인';act='골프'}
        else if(/마감/.test(n)){area='대신';act='마감'}
        else if(/후쿠오카|여행|출장/.test(n)){area='개인';act='여행'}
      }
      if(area==='개인'&&!act){if(KW['메트'].test(title))area='메트';else if(KW['선우'].test(title))area='선우';else if(KW['대신'].test(title))area='대신'}
    }
    if(!act){for(const [re,a] of ACT_KW){if(re.test(title)){act=a;break}}}
    if(!act&&e.colorId&&COLOR_ACT[e.colorId])act=COLOR_ACT[e.colorId];
  }
  return {key:cal+':'+e.id,id:e.id,cal,raw,title,area,act,tag,explicit,done,allDay,start,end,link:e.htmlLink||'',loc:e.location||'',desc:e.description||''};
}
const REVCAL={};
function parseReview(e){

  const k=m[1]+'-'+pad(+m[2])+'-01';let d=txt(e.description||'').replace(/<[^>]+>/g,'\n');
  const a=d.indexOf('{'),b=d.lastIndexOf('}');let o=null;try{o=JSON.parse(d.slice(a,b+1))}catch(x){}
  if(!o)return;
  REVCAL[k]={obs:(Array.isArray(o['관찰'])?o['관찰']:[]).map(String),sug:(Array.isArray(o['제안'])?o['제안']:[]).map(x=>({a:AREAS.includes(x&&x['영역'])?x['영역']:'개인',t:String((x&&x['내용'])||'')})).filter(x=>x.t),link:e.htmlLink||''};
}

/* 일정은 '캘린더 × 달' 단위로 받아 기기에 저장해 두고, 화면은 저장본으로 먼저 그린다 */
const mk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const mkDate=k=>new Date(+k.slice(0,4),+k.slice(5,7)-1,1);
const mkNext=k=>{const d=mkDate(k);return mk(new Date(d.getFullYear(),d.getMonth()+1,1))};
function monthsOf(from,to){const out=[];let d=new Date(from.getFullYear(),from.getMonth(),1);while(d<to&&out.length<240){out.push(mk(d));d=new Date(d.getFullYear(),d.getMonth()+1,1)}return out}
const EV_TTL={p:180000,f:180000,h:7*864e5};
const evBusy={};
function ingest(e,c){
  if(!e||!e.id||e.status==='cancelled'||!e.start)return;
  if(e.organizer){if(c==='p'&&e.organizer.self&&okMail(e.organizer.email)&&!LS.get('hint'))LS.set('hint',e.organizer.email);delete e.organizer}
  const allDay=!!e.start.date;
  e._c=c;
  e._s=+(allDay?pYmd(e.start.date):new Date(e.start.dateTime));
  e._e=+(allDay?pYmd((e.end&&e.end.date)||e.start.date):new Date((e.end&&e.end.dateTime)||e.start.dateTime));
  if(isNaN(e._s))return;if(isNaN(e._e))e._e=e._s;
  const key=c+':'+e.id;RAW.set(key,e);
  if(/돌아보기\s*\(Claude\)/.test(e.summary||'')){EV.delete(key);parseReview(e);return}
  EV.set(key,classify(e,c));
}
const evSig=list=>list.map(e=>e.id+'@'+(e.updated||'')).sort().join('|');
/* 받아 온 구간을 통째로 갈아 끼운다. 달라진 게 없으면 false */
function applyRun(c,from,to,items){
  const a=+from,b=+to,live=items.filter(e=>e&&e.id&&e.status!=='cancelled'&&e.start),old=[];
  for(const e of RAW.values()){if(e._c===c&&e._s<b&&e._e>a)old.push(e)}
  if(evSig(old)===evSig(live))return false;
  for(const e of old){const k=c+':'+e.id;RAW.delete(k);EV.delete(k)}
  if(c==='p'){for(const k of Object.keys(REVCAL)){const d=+pYmd(k);if(d>=a&&d<b)delete REVCAL[k]}}
  for(const e of live)ingest(e,c);
  return true;
}
let evT=null,evDirty=false;

  if(changed)evDirty=true;if(evT)return;
  evT=setTimeout(()=>{evT=null;if(evDirty){evDirty=false;DB.set('events',{v:1,items:[...RAW.values()]})}DB.set('fresh',FRESH)},1200);

async function fetchRun(c,months){
  const from=mkDate(months[0]),to=mkDate(mkNext(months[months.length-1])),bk='ev'+c+months[0],first=months.some(k=>!FRESH[c][k]);
  months.forEach(k=>{evBusy[c+k]=1});busy.add(bk);syncDot();
  try{
    let token=null,all=[],n=0;
    do{
      const input={startTime:ymd(from)+'T00:00:00',endTime:ymd(to)+'T00:00:00'};
      if(c!=='p')input.calendarId=CFG.cal[c];
      if(token)input.pageToken=token;
      const p=await call(CFG.GC,'list_events',input);
      all=all.concat((p&&p.events)||[]);token=p&&p.nextPageToken;n++;
    }while(token&&n<6);
    const ch=applyRun(c,from,to,all),now=Date.now();
    months.forEach(k=>{FRESH[c][k]=now});lastSync=now;
    ERRC[c]=null;saveEventsSoon(ch);
    return ch||first;
  }catch(e){
    const show=e.code!=='auth'&&!(e.code==='network'&&months.every(k=>FRESH[c][k]));
    ERRC[c]=show?e:null;
    return show;
  }finally{
    ERR.gc=ERRC.p||ERRC.f||ERRC.h;
    months.forEach(k=>{delete evBusy[c+k]});busy.delete(bk);syncDot();
  }
}
/* need: {p:[달…],f:[…],h:[…]}. 붙어 있는 달은 한 번의 요청으로 묶는다.
   force=true면 내 일정·가족 일정을 바로 다시 받고, 'all'이면 공휴일까지 다시 받는다 */
function syncEvents(need,force){
  const jobs=[],now=Date.now();
  for(const c of ['p','f','h']){
    const f=c==='h'?force==='all':!!force;
    const all=[...new Set(need[c]||[])].sort(),st=all.filter(k=>!evBusy[c+k]&&(f||!(FRESH[c][k]&&now-FRESH[c][k]<EV_TTL[c])));
    if(!st.length)continue;
    // 오래된 달 사이에 낀 달은 함께 받아 요청 수를 줄인다
    const ms=all.filter(k=>k>=st[0]&&k<=st[st.length-1]&&!evBusy[c+k]);
    let run=[ms[0]];
    for(let i=1;i<ms.length;i++){if(mkNext(run[run.length-1])===ms[i])run.push(ms[i]);else{jobs.push(fetchRun(c,run));run=[ms[i]]}}
    jobs.push(fetchRun(c,run));
  }
  if(jobs.length)Promise.all(jobs).then(rs=>{if(rs.some(Boolean))render()});
}
function viewNeeds(){
  const v=S.view,c=S.cur,n={p:[],f:[],h:[]};
  if(v==='year')n.h=monthsOf(new Date(c.getFullYear(),0,1),new Date(c.getFullYear()+1,0,1));
  else if(v==='month'){const ms=mStart(c),gs=wkStart(ms),ge=addD(gs,42),pm=new Date(ms.getFullYear(),ms.getMonth()-1,1);n.p=n.f=monthsOf(pm,ge);n.h=monthsOf(gs,ge)}

}
/* 기기에 저장해 둔 일정·기록을 읽어 온다(앱을 열자마자 화면을 그리기 위해) */
async function cacheLoad(){
  const [ev,fr,tb]=await Promise.all([DB.get('events'),DB.get('fresh'),DB.get('tables')]);
  if(ev&&ev.v===1&&Array.isArray(ev.items)&&fr){
    const now=Date.now();
    for(const c of ['p','f','h']){for(const k in (fr[c]||{})){if(now-fr[c][k]<200*864e5)FRESH[c][k]=fr[c][k]}}
    for(const e of ev.items){
      if(!e||!FRESH[e._c]||isNaN(e._s))continue;
      if(!monthsOf(new Date(e._s),new Date(Math.max(e._e,e._s+1))).some(k=>FRESH[e._c][k]))continue;   // 오래전에 받아 둔 달의 일정은 버린다
      ingest(e,e._c);
    }
  }
  if(tb&&tb.v===1&&tb.tabs&&(!SHEET_ID||tb.sheet===SHEET_ID)){
    for(const ds in tb.tabs){if(STAB[ds]&&tb.tabs[ds]&&Array.isArray(tb.tabs[ds].rows))TBL[ds]=tb.tabs[ds]}
    Object.assign(CONF,tb.conf||{});tblSig=tb.sig||0;applyConf();
  }
}
function evOn(day){

    .sort((x,y)=>(y.allDay-x.allDay)||(x.start-y.start)||(x.cal==='h'?-1:1));
}

function evArea(e){return e.cal==='h'?'휴일':e.cal==='f'?'가족':e.area}

const rowsOf=ds=>(TBL[ds]&&TBL[ds].rows)||[];
const dF=(p,op,v)=>({property:p,operator:op,value:v});
function qRows(ds,filters,sort){
  let rows=rowsOf(ds).slice();
  for(const f of (filters||[])){const k='date:'+f.property+':start',v=f.value;rows=rows.filter(r=>{const x=String(r[k]||'').slice(0,10);if(!x)return false;
    switch(f.operator){case 'date_is':return x===v;case 'date_is_on_or_after':return x>=v;case 'date_is_before':return x<v;default:return true}})}
  if(sort){const k='date:'+sort[0]+':start',dr=sort[1]==='desc'?-1:1;rows.sort((a,b)=>String(a[k]||'').localeCompare(String(b[k]||''))*dr)}
  return rows;
}
function loadRows(key,ds,filters,sort){if(R[key]||!TBL[ds])return;R[key]=qRows(ds,filters,sort);afterRows(key)}

/* 지금 화면에 필요한 기록을 저장본에서 뽑는다(그릴 때마다 호출, 이미 뽑았으면 건너뜀) */
function derive(){
  const v=S.view,c=S.cur;
  if(v==='month'){const ms=mStart(c);qMeetRange(ms,new Date(ms.getFullYear(),ms.getMonth()+1,1))}

}

/* 돌아보기 */
function monthStats(ms,upto){
  const me=new Date(ms.getFullYear(),ms.getMonth()+1,1),now=new Date(),t=today();
  const cut=upto?new Date(Math.min(+upto,+me)):(t>=ms&&t<me)?addD(t,1):me;
  const all=[...EV.values()].filter(e=>e.cal!=='h'&&e.start>=ms&&e.start<me);
  const past=all.filter(e=>e.start<cut);
  const A={};AREAS.concat('미분류').forEach(a=>A[a]={h:0,n:0,acts:{}});
  const kakao={n:0,done:0,open:[]},dl={n:0,done:0,open:[]},guess=[],wd=[0,0,0,0,0,0,0],people={};
  let ex=0,golf=0;
  for(const e of past){
    const a=A[e.area]?e.area:'개인',S2=A[a];S2.n++;
    const ac=e.act||'기타';S2.acts[ac]=(S2.acts[ac]||0)+1;
    if(!e.allDay&&e.tag!=='카톡'){const h=Math.min(12,(e.end-e.start)/3600000);if(h>0)S2.h+=h}
    if(e.tag==='카톡'){kakao.n++;if(e.done)kakao.done++;else if(e.end<=now)kakao.open.push(e.key)}
    else if(e.act==='마감'){dl.n++;if(e.done)dl.done++;else if(e.end<=now)dl.open.push(e.key)}
    if(e.cal==='p'&&!e.explicit&&e.tag!=='카톡')guess.push(e.key);
    if(['대신','선우','메트'].includes(a)&&!e.allDay&&e.tag!=='카톡')wd[e.start.getDay()]++;
    if(e.act==='운동')ex++;if(e.act==='골프')golf++;
    if(['대신','선우','메트'].includes(a)&&e.tag!=='카톡'){const pm=e.title.match(/[–—-]\s*([^–—-]+)$/);const who=pm?pm[1].trim():'';if(who&&who.length<=20)people[who]=(people[who]||0)+1}
  }
  const days=Math.max(1,Math.round((Math.min(+cut,+me)-ms)/86400000));
  let nx=addD(t,1);while(nx.getDay()===0||nx.getDay()===6)nx=addD(nx,1);
  return {ms,cut,current:t>=ms&&t<me,days,A,kakao,dl,guess,wd,ex,golf,people,nx:ymd(nx),total:past.length};
}

function ruleSuggest(st,pst,pt,avg){
  const out=[],nx=st.nx;
  if(pst&&!st.current){for(const a of ['대신','선우','메트']){const now=st.A[a].n,pv=pst.A[a].n;if(pv>=4&&now<pv*0.7)out.push(sgRow(a+' 일정이 지난달 '+pv+'건에서 '+now+'건으로 줄었습니다. 다음 일정을 잡아 둘까요?','일정 잡기','data-act="sugev" data-a="'+a+'" data-d="'+nx+'"'))}}
  else if(!pst||st.current){const s=st.A['선우'];if(s.n<=2)out.push(sgRow('이번 달 선우 일정이 '+s.n+'건입니다. 다음 일정을 잡아 둘까요?','일정 잡기','data-act="sugev" data-a="선우" data-d="'+nx+'"'))}
  if(avg<pt)out.push(sgRow('운동이 주평균 '+avg+'회로 목표(주 '+pt+'회)보다 적습니다.','일정 잡기','data-act="sugev" data-a="개인" data-c="운동" data-d="'+nx+'"'));
  if(st.dl.open.length)out.push(sgRow('기한이 지났는데 완료 표시가 없는 마감 '+st.dl.open.length+'건이 있습니다.','확인','data-act="listsheet" data-kind="dl"'));
  if(st.kakao.open.length)out.push(sgRow('완료 표시가 없는 지난 카톡 회신 '+st.kakao.open.length+'건이 있습니다.','확인','data-act="listsheet" data-kind="kakao"'));
  if(st.guess.length)out.push(sgRow('말머리 없이 추정으로 분류한 일정이 '+st.guess.length+'건입니다. 맞게 분류해 두면 분석이 정확해집니다.','분류하기','data-act="listsheet" data-kind="guess"'));
  return out;
}
function claudeBlock(ms){

const PX=48;
function fmtDur(m){m=Math.round(m);const h=Math.floor(m/60),r=m%60;return (h?h+'시간':'')+(r?(h?' ':'')+r+'분':'')||'0분'}
function vDay(){
  const d=S.cur,ds=ymd(d),t0=+d,t1=+addD(d,1),now=Date.now(),isT=same(d,today());
  const evs=evOn(d),hol=evs.filter(e=>e.cal==='h'),oth=evs.filter(e=>e.cal!=='h');

  for(let hh=H0;hh<=H1;hh++){tl+='<div class="hr" style="top:'+((hh-H0)*PX)+'px"><span>'+pad(hh%24)+':00</span></div>';if(hh<H1)tl+='<div class="hh" style="top:'+((hh-H0)*PX+PX/2)+'px"></div>'}

  let cur=Math.max(t0+9*3600000,isT?Math.ceil(now/900000)*900000:0);const wEnd=t0+19*3600000;

    cur=Math.max(cur,be);

    tl+='<div class="bk '+aCls(evArea(e))+(e.tag==='카톡'?' kt':'')+(e.done?' dn':'')+'" data-act="ev" data-k="'+esc(e.key)+'" style="top:'+top+'px;height:'+hgt+'px;left:'+lft+';width:'+wd+'"><span class="tm">'+hm(new Date(x.s))+(hgt>30?'–'+hm(new Date(x.t)):'')+'</span>'+(e.done?'✔ ':'')+esc(e.title)+(hgt>44&&e.loc?'<span class="lc">'+esc(e.loc)+'</span>':'')+'</div>'}

function saveFocus(){

  if(o.bind){const el=pagesEl.querySelector('[data-bind="'+CSS.escape(o.bind)+'"]');if(el){el.focus({preventScroll:true});try{if(o.s!=null)el.setSelectionRange(o.s,o.e)}catch(e){}}}

/* ---------- 넘기기 ---------- */
function flipTo(mut,dir){
  const old=[...pagesEl.querySelectorAll(':scope>.page')].map(p=>p.cloneNode(true));
  const oldMode=S.mode;
  mut();render();ensure();
  if(flipping||matchMedia('(prefers-reduced-motion: reduce)').matches||oldMode!==S.mode)return;
  const now=[...pagesEl.querySelectorAll(':scope>.page')];
  flipping=true;
  const face=(node,back)=>{const f=document.createElement('div');f.className='face'+(back?' back':'');f.appendChild(node);return f};
  const leaf=document.createElement('div');leaf.className='leaf';
  const cover=document.createElement('div');cover.className='cover';
  let target;
  if(S.mode==='spread'&&old.length===2&&now.length===2){
    if(dir>0){leaf.style.cssText='left:50%;width:50%;transform-origin:left center';leaf.append(face(old[1]),face(now[0].cloneNode(true),true));cover.style.cssText='left:0;width:50%';cover.appendChild(old[0]);target='rotateY(-180deg)'}
    else{leaf.style.cssText='left:0;width:50%;transform-origin:right center';leaf.append(face(old[0]),face(now[1].cloneNode(true),true));cover.style.cssText='left:50%;width:50%';cover.appendChild(old[1]);target='rotateY(180deg)'}
    book.append(cover,leaf);
  }else if(old.length===1){
    if(dir>0){leaf.style.cssText='left:0;width:100%;transform-origin:left center';leaf.append(face(old[0]));target='rotateY(-100deg)';book.append(leaf);leaf.dataset.fade='1'}
    else{leaf.style.cssText='left:0;width:100%;transform-origin:left center;transform:rotateY(-100deg);opacity:0';leaf.append(face(now[0].cloneNode(true)));cover.style.cssText='left:0;width:100%';cover.appendChild(old[0]);book.append(cover,leaf);target='rotateY(0deg)'}
  }else{flipping=false;return}
  let done=false;const end=()=>{if(done)return;done=true;leaf.remove();cover.remove();flipping=false};
  leaf.addEventListener('transitionend',e=>{if(e.target===leaf&&e.propertyName==='transform')end()});
  setTimeout(end,900);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{leaf.style.transform=target;if(leaf.dataset.fade)leaf.style.opacity='0';else if(dir<0&&old.length===1)leaf.style.opacity='1'}));
}
function step(dir){
  const v=S.view;
  if(S.mode==='single'){
    if(dir>0&&S.page===0){flipTo(()=>{S.page=1},1);return}
    if(dir<0&&S.page===1){flipTo(()=>{S.page=0},-1);return}
  }
  if(!PAGED(v))return;
  flipTo(()=>{
    const c=S.cur;
    if(v==='year')S.cur=new Date(c.getFullYear()+dir,0,1);
    else if(v==='month')S.cur=new Date(c.getFullYear(),c.getMonth()+dir,1);
    else if(v==='week')S.cur=addD(c,7*dir);
    else S.cur=addD(c,dir);
    if(S.mode==='single')S.page=dir>0?0:1;
  },dir);
}
function go(view,cur,page){
  flipTo(()=>{S.view=view;if(cur)S.cur=cur;S.page=page||0},1);
}

function listSheet(kind){
  const ms=mStart(S.cur),st=monthStats(ms);let keys=kind==='dl'?st.dl.open:kind==='kakao'?st.kakao.open:st.guess;
  if(kind==='kakaowk'){const ws=wkStart(S.cur),we=addD(ws,7);keys=[...EV.values()].filter(e=>e.tag==='카톡'&&!e.done&&e.start>=ws&&e.start<we).sort((a,b)=>a.start-b.start).map(e=>e.key)}
  const ttl=kind==='dl'?'완료 표시가 없는 마감':kind==='kakao'?'완료 표시가 없는 카톡 회신':kind==='kakaowk'?'이번 주 카톡 회신·확인':'추정으로 분류한 일정';
  let h='<h3>'+ttl+'</h3><div class="meta">'+(kind==='guess'?'영역을 누르면 캘린더 제목 앞에 말머리가 붙습니다.':'처리한 일정은 완료 표시를 해 두세요. 캘린더 제목 앞에 ✔가 붙습니다.')+'</div>';
  if(!keys.length)h+='<div class="muted">남은 일정이 없습니다.</div>';
  for(const k of keys.slice(0,40)){const e=EV.get(k);if(!e)continue;
    h+='<div style="padding:6px 0;border-bottom:1px dashed var(--rule)"><div class="row" style="font-size:13px"><span class="d" style="font-size:11.5px;color:var(--ink2);min-width:54px">'+md(e.start)+'('+DOW[e.start.getDay()]+')</span><span style="flex:1;min-width:0">'+esc(e.title)+'</span></div>';
    h+=kind==='guess'?'<div class="chips" style="margin:4px 0 0">'+AREAS.map(a=>'<button class="chip area '+aCls(a)+(e.area===a?' on':'')+'" data-act="evarea" data-k="'+esc(k)+'" data-a="'+a+'" data-keep="1">'+a+'</button>').join('')+'</div>'
      :'<div class="row" style="justify-content:flex-end;margin-top:3px"><button class="btn sm" data-act="evdone" data-k="'+esc(k)+'" data-keep="1">완료 표시</button></div>';
    h+='</div>'}
  h+='<div class="acts"><button class="btn primary" data-act="close">닫기</button></div>';
  openSheet(h,{list:kind});
}
const NE={title:'',area:'대신',act:'',date:'',allDay:false,s:'10:00',e:'11:00'};
function newEvSheet(date,area,act,st,en){
  NE.title='';NE.date=date||ymd(S.cur);NE.allDay=false;if(area){NE.area=area;NE.act=act||''}else{NE.act=''}
  NE.s=st||(area?'14:00':'10:00');NE.e=en||(st?pad((+st.slice(0,2)+1)%24)+':'+st.slice(3):(area?'15:00':'11:00'))
  drawNewEv();
}
function drawNewEv(){
  openSheet('<h3>일정 추가</h3><div class="meta">Google 캘린더에 [영역·활동] 말머리를 붙여 저장합니다.</div>'+
    '<div class="fld"><label>제목</label><input type="text" id="ne-t" value="'+esc(NE.title)+'" placeholder="잠원동 아파트 – 신한은행"></div>'+
    '<div class="fld"><label>영역</label><div class="chips" style="margin:0">'+AREAS.map(a=>'<button class="chip area '+aCls(a)+(NE.area===a?' on':'')+'" data-act="nearea" data-a="'+a+'">'+a+'</button>').join('')+'</div></div>'+
    '<div class="fld"><label>활동</label><div class="chips" style="margin:0">'+ACTS[NE.area].map(c=>'<button class="chip'+(NE.act===c?' on':'')+'" data-act="neact" data-c="'+c+'">'+c+'</button>').join('')+'</div></div>'+
    '<div class="fld"><label>날짜</label><input type="date" id="ne-d" value="'+NE.date+'"></div>'+
    '<label class="goal" style="font-size:12.5px"><input type="checkbox" id="ne-a"'+(NE.allDay?' checked':'')+' data-act="neall"><span class="x">종일</span></label>'+
    (NE.allDay?'':'<div class="fld"><label>시간</label><input type="time" id="ne-s" value="'+NE.s+'"><input type="time" id="ne-e" value="'+NE.e+'"></div>')+
    '<div class="note" id="ne-err" style="display:none"></div>'+
    '<div class="acts"><button class="btn" data-act="close">취소</button><button class="btn primary" data-act="nesave">저장</button></div>');
}
function readNE(){const t=$('#ne-t');if(t)NE.title=t.value;const d=$('#ne-d');if(d)NE.date=d.value;const s=$('#ne-s');if(s)NE.s=s.value;const e=$('#ne-e');if(e)NE.e=e.value}

/* ---------- 동작 ---------- */
async function act(a,ds,el){
  switch(a){
  case 'tab':{const v=ds.v;if(v===S.view&&S.mode!=='single')return;flipTo(()=>{S.view=v;S.page=0},1);break}
  case 'today':go(S.view==='meet'||S.view==='idea'||S.view==='set'?'day':S.view,today(),0);break;
  case 'prev':step(-1);break;
  case 'next':step(1);break;
  case 'goday':if(el.closest('[data-act="ev"]'))return;go('day',pYmd(ds.d),0);break;
  case 'gomonth':go('month',pYmd(ds.d),0);break;
  case 'daysheet':daySheet(ds.d);break;
  case 'sheetday':closeSheet();go('day',pYmd(ds.d),0);break;
  case 'listsheet':listSheet(ds.kind);break;
  case 'sugev':newEvSheet(ds.d||ymd(addD(today(),1)),ds.a,ds.c||'',ds.s,ds.e);break;
  case 'login':startAuth(false);break;
  case 'logout':doLogout();break;
  case 'applyupd':persistState();location.reload();break;
  case 'evact':await evSetArea(ds.k,ds.a,ds.c);break;
  case 'evdone':await evDone(ds.k,ds.keep==='1');break;
  case 'neact':readNE();NE.act=NE.act===ds.c?'':ds.c;drawNewEv();break;
  case 'ev':evSheet(ds.k);break;
  case 'retry':ERR.gc=ERR.no=null;ERRC.p=ERRC.f=ERRC.h=null;ensure(true);render();break;
  case 'refresh':refreshAll();toast('다시 불러오는 중입니다');break;
  case 'close':closeSheet();break;
  case 'confirm-yes':{const y=sheetCtx&&sheetCtx.yes;closeSheet();if(y)y();break}
  case 'evarea':await evSetArea(ds.k,ds.a,null,ds.keep==='1');break;
  case 'evmeet':{const e=EV.get(ds.k);closeSheet();if(e)openMeetFromEvent(e);break}
  case 'newev':newEvSheet(ds.d,null,null,ds.s,ds.e);break;
  case 'nearea':readNE();if(NE.area!==ds.a){NE.area=ds.a;NE.act=''}drawNewEv();break;
  case 'neall':readNE();NE.allDay=el.checked;drawNewEv();break;
  case 'nesave':await saveNewEv();break;
  case 'goal':await toggleGoal(ds.id,el.checked);break;
  case 'goaladd':await addGoal(ds.kind,ds.d);break;
  case 'habit':{const dr=dDraft(ds.d),h=ds.h;dr.habits=dr.habits.includes(h)?dr.habits.filter(x=>x!==h):dr.habits.concat(h);dr.dirty=true;render();break}
  case 'dailysave':await saveDaily(ds.d);break;
  case 'meetf':S.meetF=ds.a;render();break;
  case 'meetnew':guardMeet(()=>{drafts.meet=newMeet(ds.d||ymd(S.view==='day'?S.cur:today()));toMeetEditor()});break;
  case 'meetopen':guardMeet(()=>{const r=findRow('meet:',ds.id);if(r){drafts.meet=meetFromRow(r);toMeetEditor()}});break;
  case 'meetarea':drafts.meet.f.area=ds.a;drafts.meet.dirty=true;render();break;
  case 'meetfu':drafts.meet.fu=el.checked;break;
  case 'meetsave':await saveMeet();break;
  case 'meetclose':guardMeet(()=>{drafts.meet=null;if(S.mode==='single')S.page=0;render()});break;
  case 'ideaf':S.ideaF=ds.a;render();break;
  case 'ideanew':guardIdea(()=>{drafts.idea={id:'',f:{title:'',area:S.ideaF!=='전체'?S.ideaF:'대신',status:'아이디어',date:ymd(today()),body:''},dirty:false};toIdeaEditor()});break;
  case 'ideaopen':guardIdea(()=>{const r=findRow('idea:',ds.id);if(r){drafts.idea={id:rowId(r),f:{title:txt(r['제목']),area:r['영역']||'개인',status:r['상태']||'아이디어',date:txt(r['date:작성일:start']).slice(0,10),body:txt(r['내용'])},dirty:false};toIdeaEditor()}});break;
  case 'ideaarea':drafts.idea.f.area=ds.a;drafts.idea.dirty=true;render();break;
  case 'ideasave':await saveIdea();break;
  case 'ideaclose':guardIdea(()=>{drafts.idea=null;if(S.mode==='single')S.page=0;render()});break;
  case 'hdel':habits.splice(+ds.i,1);await saveHabits();render();break;
  case 'hadd':{const n=HN.name.trim();if(!n){toast('습관 이름을 적어 주세요');return}if(habits.some(h=>h.name===n)){toast('이미 있는 습관입니다');return}habits.push({name:n,n:+HN.n||3});HN.name='';await saveHabits();render();break}
  }
}
function findRow(prefix,id){return rowsOf(prefix.replace(/:$/,'')).find(x=>rowId(x)===id)||null}
function guardMeet(fn){if(drafts.meet&&drafts.meet.dirty)confirmSheet('저장하지 않은 미팅 기록이 있습니다. 버리고 진행할까요?',fn);else fn()}
function guardIdea(fn){if(drafts.idea&&drafts.idea.dirty)confirmSheet('저장하지 않은 구상 노트가 있습니다. 버리고 진행할까요?',fn);else fn()}
function toMeetEditor(){if(S.view!=='meet')go('meet',null,S.mode==='single'?1:0);else if(S.mode==='single'&&S.page===0)flipTo(()=>{S.page=1},1);else render()}
function toIdeaEditor(){if(S.mode==='single'&&S.page===0)flipTo(()=>{S.page=1},1);else render()}
function newMeet(date){return {id:'',f:{title:'',date:date,time:'',area:'대신',who:'',place:'',agenda:'',notes:'',decision:'',follow:'',due:'',calRef:''},dirty:false,fu:true}}
function meetFromRow(r){
  const d=meetDate(r),raw=txt(r['date:일시:start']);
  return {id:rowId(r),f:{title:txt(r['제목']),date:d?ymd(d):'',time:d&&raw.length>10?hm(d):'',area:r['영역']||'개인',who:txt(r['상대방']),place:txt(r['장소']),agenda:txt(r['안건']),notes:txt(r['논의 내용']),decision:txt(r['결정 사항']),follow:txt(r['후속조치']),due:txt(r['date:후속 기한:start']).slice(0,10),calRef:txt(r['캘린더ID'])},dirty:false,fu:true};
}
function openMeetFromEvent(e){
  guardMeet(()=>{
    const ex=rowsOf('meet').find(r=>calRefPart(r['캘린더ID'],'원본')===e.id);
    if(ex)drafts.meet=meetFromRow(ex);
    else{const m=newMeet(ymd(e.start));m.f.title=e.title;m.f.time=e.allDay?'':hm(e.start);m.f.area=AREAS.includes(e.area)?e.area:'개인';m.f.place=e.loc;m.f.calRef='원본:'+e.id;m.dirty=true;drafts.meet=m}
    toMeetEditor();
  });
}

/* ---------- 저장 ---------- */
function writeErr(e,server){toast(errMsg(e,server)+(e&&e.status>=500?' 저장됐는지 잠시 뒤 확인해 주세요.':''))}
/* 캘린더에 쓴 내용은 저장본에도 바로 반영한다(전체를 다시 받아 오지 않는다) */
function patchLocal(k,resp,summary){
  const raw=RAW.get(k);if(!raw)return;
  if(resp&&resp.id){for(const f of ['status','summary','description','location','htmlLink','colorId','start','end','updated'])if(resp[f]!==undefined)raw[f]=resp[f]}
  else raw.summary=summary;
  ingest(raw,raw._c);saveEventsSoon(true);
}
function addLocal(resp){if(resp&&resp.id&&resp.start){ingest(resp,'p');saveEventsSoon(true);return true}return false}
async function evSetArea(k,area,act,keep){
  const e=EV.get(k);if(!e)return;
  if(act==null)act=(ACTS[area]||[]).includes(e.act)?e.act:'';
  if(e.area===area&&e.explicit&&e.act===act){if(!keep)closeSheet();return}
  const summary=buildSummary(e,area,act);
  try{const r=await call(CFG.GC,'update_event',{eventId:e.id,summary});
    patchLocal(k,r,summary);
    toast(area+(act?'·'+act:'')+' 일정으로 바꿨습니다');
    if(keep&&sheetCtx&&sheetCtx.list)listSheet(sheetCtx.list);else evSheet(k);
    render();
  }catch(err){writeErr(err,CFG.GC)}
}
async function evDone(k,keep){
  const e=EV.get(k);if(!e||e.done)return;
  const summary='✔'+e.raw.replace(/^✔\s*/,'');
  try{const r=await call(CFG.GC,'update_event',{eventId:e.id,summary});
    patchLocal(k,r,summary);
    toast('완료 표시를 했습니다');
    if(keep&&sheetCtx&&sheetCtx.list)listSheet(sheetCtx.list);else closeSheet();
    render();
  }catch(err){writeErr(err,CFG.GC)}
}
async function saveNewEv(){
  readNE();const t=NE.title.trim(),box=$('#ne-err');
  const fail=m=>{box.textContent=m;box.style.display='block'};
  if(!t)return fail('제목을 적어 주세요.');
  if(!NE.date)return fail('날짜를 골라 주세요.');
  const input={summary:'['+NE.area+(NE.act?'·'+NE.act:'')+'] '+t};
  if(NE.allDay){input.startTime=NE.date+'T00:00:00';input.endTime=ymd(addD(pYmd(NE.date),1))+'T00:00:00';input.allDay=true}
  else{if(!NE.s||!NE.e||NE.e<=NE.s)return fail('종료 시간이 시작보다 늦어야 합니다.');input.startTime=NE.date+'T'+NE.s+':00';input.endTime=NE.date+'T'+NE.e+':00'}
  const btn=sheet.querySelector('[data-act="nesave"]');if(btn){btn.disabled=true;btn.textContent='저장 중…'}
  try{const r=await call(CFG.GC,'create_event',input);const local=addLocal(r);
    closeSheet();toast('캘린더에 저장했습니다');render();
    if(!local)ensure(true);
  }catch(e){if(btn){btn.disabled=false;btn.textContent='저장'}fail(errMsg(e,CFG.GC))}
}
async function toggleGoal(id,on){
  const r=findRow('goal:',id);if(r)r['완료']=on?'__YES__':'__NO__';render();
  try{await nUpdate(id,{'완료':on?'__YES__':'__NO__'},'goal')}
  catch(e){if(r)r['완료']=on?'__NO__':'__YES__';tblSig=0;render();writeErr(e,CFG.NO)}
}
async function addGoal(kind,d){
  const t=(G.text[kind]||'').trim();if(!t){toast('목표를 적어 주세요');return}
  try{await nCreate(CFG.ds.goal,{'제목':t,'구분':kind,'date:시작일:start':d,'date:시작일:is_datetime':0,'영역':G.area,'완료':'__NO__'});
    G.text[kind]='';render();
  }catch(e){writeErr(e,CFG.NO)}
}
async function saveDaily(d){
  const dr=dDraft(d);if(dr.saving)return;
  const dt=pYmd(d);
  const props={'제목':d+' ('+DOW[dt.getDay()]+')','date:날짜:start':d,'date:날짜:is_datetime':0,'처리한 일':dr.f.done,'미결·내일 할 일':dr.f.todo,'개선할 점':dr.f.improve,'메모':dr.f.memo,'완료 습관':dr.habits};
  dr.saving=true;render();
  try{
    if(!TBL.daily)await syncTables(true);
    // 같은 날짜의 줄이 이미 있으면 그 줄을 고친다(중복 방지)
    if(!dr.id||!rowsOf('daily').some(x=>x.id===dr.id)){const ex=rowsOf('daily').find(r=>txt(r['date:날짜:start']).slice(0,10)===d);dr.id=ex?rowId(ex):''}
    if(dr.id)await nUpdate(dr.id,props,'daily');else dr.id=await nCreate(CFG.ds.daily,props);
    dr.dirty=false;toast('저장했습니다');
  }catch(e){writeErr(e,CFG.NO)}
  finally{dr.saving=false;saveDraftsSoon();render()}
}
async function saveMeet(){
  const m=drafts.meet;if(!m||m.saving)return;const f=m.f;
  if(!f.title.trim()&&!f.who.trim()){toast('제목이나 상대방을 적어 주세요');return}
  m.saving=true;render();
  let warn='';
  try{
    if(m.fu&&f.due&&f.follow.trim()&&!calRefPart(f.calRef,'후속')){
      try{const p=await call(CFG.GC,'create_event',{summary:'['+f.area+'] 후속: '+(f.who?f.who+' – ':'')+firstLine(f.follow).slice(0,50),startTime:f.due+'T00:00:00',endTime:ymd(addD(pYmd(f.due),1))+'T00:00:00',allDay:true,description:'미팅·상담 기록: '+(f.title||f.who)});
        f.calRef=setCalRef(f.calRef,'후속',(p&&p.id)||'등록됨');addLocal(p);
      }catch(e){warn=' 후속 일정은 등록하지 못했습니다: '+errMsg(e,CFG.GC)}
    }
    const props={'제목':f.title.trim()||(f.who+' 미팅'),'영역':f.area,'상대방':f.who,'장소':f.place,'안건':f.agenda,'논의 내용':f.notes,'결정 사항':f.decision,'후속조치':f.follow,'캘린더ID':f.calRef};
    if(f.date){if(f.time){props['date:일시:start']=f.date+'T'+f.time+':00'+tzOff();props['date:일시:is_datetime']=1}else{props['date:일시:start']=f.date;props['date:일시:is_datetime']=0}}
    else if(m.id)props['date:일시:start']=null;
    if(f.due){props['date:후속 기한:start']=f.due;props['date:후속 기한:is_datetime']=0}else if(m.id)props['date:후속 기한:start']=null;
    if(m.id)await nUpdate(m.id,props,'meet');else m.id=await nCreate(CFG.ds.meet,props);
    m.dirty=false;toast('저장했습니다.'+warn);
  }catch(e){writeErr(e,CFG.NO)}
  finally{m.saving=false;saveDraftsSoon();render()}
}
async function saveIdea(){
  const m=drafts.idea;if(!m||m.saving)return;const f=m.f;
  if(!f.title.trim()){toast('제목을 적어 주세요');return}
  m.saving=true;render();
  try{
    const props={'제목':f.title.trim(),'영역':f.area,'상태':f.status,'내용':f.body};
    if(f.date){props['date:작성일:start']=f.date;props['date:작성일:is_datetime']=0}
    if(m.id)await nUpdate(m.id,props,'idea');else m.id=await nCreate(CFG.ds.idea,props);
    m.dirty=false;toast('저장했습니다');
  }catch(e){writeErr(e,CFG.NO)}
  finally{m.saving=false;saveDraftsSoon();render()}
}
async function saveHabits(){
  try{localStorage.setItem('diary2027.habits',JSON.stringify(habits))}catch(e){}
  if(LS.get('hadLogin')){try{await confSet('habits',JSON.stringify(habits))}catch(e){toast('습관 설정을 시트에 올리지 못했습니다. 이 기기에는 저장했습니다.')}}
}
/* 로그아웃: 이 기기에 남겨 둔 연결 정보와 저장본을 지운다 */
function doLogout(){
  ['token','hadLogin','hint','silentMode','needLogin','bounceAt','authState','frameTestAt','authLog'].forEach(k=>LS.del(k));
  RAW.clear();EV.clear();for(const c in FRESH)FRESH[c]={};for(const k in TBL)delete TBL[k];for(const k in REVCAL)delete REVCAL[k];for(const k in CONF)delete CONF[k];dropRows();
  tblSig=0;tblAt=0;forgetSheet();DB.del('events');DB.del('fresh');DB.del('tables');
  ERR.gc=ERR.no=null;ERRC.p=ERRC.f=ERRC.h=null;AUTH.st='none';AUTH.err='';render();toast('로그아웃했습니다');
}

/* ---------- 입력 바인딩 ---------- */
function setBind(path,val){
  const p=path.split('.');
  if(p[0]==='daily'){const dr=dDraft(p[1]);dr.f[p[2]]=val;if(!dr.dirty){dr.dirty=true;markDirty()}}
  else if(p[0]==='meet'&&drafts.meet){drafts.meet.f[p[1]]=val;if(!drafts.meet.dirty){drafts.meet.dirty=true;markDirty()}}
  else if(p[0]==='idea'&&drafts.idea){drafts.idea.f[p[1]]=val;if(!drafts.idea.dirty){drafts.idea.dirty=true;markDirty()}}
  else if(p[0]==='gText')G.text[p[1]]=val;
  else if(p[0]==='gArea')G.area=val;
  else if(p[0]==='hNew')HN[p[1]]=val;
}
function markDirty(){pagesEl.querySelectorAll('.savebar .st').forEach(s=>{s.textContent='저장하지 않은 내용이 있습니다';s.classList.add('dirty')})}
book.addEventListener('input',e=>{const b=e.target.dataset&&e.target.dataset.bind;if(b){setBind(b,e.target.value);saveDraftsSoon()}});
book.addEventListener('change',e=>{const b=e.target.dataset&&e.target.dataset.bind;if(b){setBind(b,e.target.value);saveDraftsSoon()}});
book.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input[type=text]')){const btn=e.target.parentElement.querySelector('[data-act="goaladd"],[data-act="hadd"]');if(btn){e.preventDefault();btn.click()}}});
function onClick(e){
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.tagName==='INPUT'&&el.type==='checkbox'&&!['goal','meetfu','neall'].includes(el.dataset.act))return;
  if(el.tagName==='BUTTON'||el.tagName==='A')e.stopPropagation();
  if(el.tagName==='A')return;
  Promise.resolve(act(el.dataset.act,el.dataset,el)).catch(e=>console.error(e)).then(saveDraftsSoon);
}
book.addEventListener('click',onClick);tabsEl.addEventListener('click',onClick);
sheet.addEventListener('click',e=>{if(e.target===sheet){closeSheet();return}onClick(e)});
/* 스와이프 */
let tx=null;
book.addEventListener('touchstart',e=>{if(e.touches.length!==1||e.target.closest('textarea,input,select')){tx=null;return}const t=e.touches[0];tx={x:t.clientX,y:t.clientY,t:Date.now()}},{passive:true});
book.addEventListener('touchend',e=>{if(!tx)return;const t=e.changedTouches[0],dx=t.clientX-tx.x,dy=t.clientY-tx.y;if(Math.abs(dx)>60&&Math.abs(dy)<Math.abs(dx)*0.6&&Date.now()-tx.t<800)step(dx<0?1:-1);tx=null},{passive:true});
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea,select'))return;if(!sheet.hidden){if(e.key==='Escape')closeSheet();return}if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1)});
/* 화면 모드 */
function detectMode(){
  const w=innerWidth,h=innerHeight,m=(w>=640&&w>h*1.05)?'spread':'single';
  document.getElementById('app').className=m;
  if(m!==S.mode){S.mode=m;if(m==='spread')S.page=0;render()}
}
/* ---------- 주기 점검·복귀 ---------- */
let proFor=0,lastForce=0,lastUpd=0;
function tick(){
  if(document.visibilityState!=='visible')return;
  if(S.view==='day'&&same(S.cur,today())&&sheet.hidden&&!flipping&&!(document.activeElement&&pagesEl.contains(document.activeElement)))render();
  if(!LS.get('hadLogin')||!navigator.onLine)return;
  const tk=LS.get('token'),left=tk?tk.exp-Date.now():0;
  if(left<=0){if(AUTH.st==='ok'||AUTH.st==='off')connect().then(ok=>{if(ok)ensure()})}
  else if(left<5*60000&&proFor!==tk.exp){proFor=tk.exp;renew()}   // 만료 5분 전에 미리 연장
}
setInterval(tick,60000);
let rz=null;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(detectMode,150)});
/* 다른 앱에 다녀왔다가 돌아왔을 때 */
async function resume(){
  checkUpdate();
  if(!LS.get('hadLogin'))return;
  if(!(await connect()))return;
  const n=Date.now();if(n-lastForce>30000){lastForce=n;ensure(true)}else ensure();
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){saveDraftsNow();if(UPD){persistState();location.reload()}return}
  resume();
});
addEventListener('online',resume);
addEventListener('offline',()=>{if(AUTH.st==='ok'&&!tokenValid())setAuth('off')});
addEventListener('pagehide',saveDraftsNow);
addEventListener('pointerdown',()=>{touched=true},{passive:true,capture:true});
addEventListener('keydown',()=>{touched=true},{capture:true});

/* ---------- 새 버전 ---------- */
function onUpdate(){
  // 막 열었고 아직 아무것도 누르지 않았으면 바로 새 버전으로 바꾼다. 아니면 화면을 떠날 때 바꾼다
  if(Date.now()-T0<8000&&!touched&&!LS.get('drafts')&&Date.now()-(SS.get('updAt')||0)>120000){SS.set('updAt',Date.now());persistState();location.reload();return}
  if(!UPD){UPD=true;if(S.view==='set')render()}
}
async function checkUpdate(){
  const n=Date.now();if(n-lastUpd<600000)return;lastUpd=n;
  try{
    const c=navigator.serviceWorker&&navigator.serviceWorker.controller;if(!c||!window.caches)return;
    c.postMessage({t:'d27-check'});await sleep(4000);
    const r=await caches.match('./');if(!r)return;
    const m=(await r.text()).match(/BUILD='([^']+)'/);
    if(m&&m[1]!==BUILD)onUpdate();
  }catch(e){}
}

/* ---------- 시작 ---------- */
function boot(){
  S.mode=(innerWidth>=640&&innerWidth>innerHeight*1.05)?'spread':'single';
  document.getElementById('app').className=S.mode;
  try{const ls=localStorage.getItem('diary2027.habits');if(ls){const a=JSON.parse(ls);if(Array.isArray(a))habits=a}}catch(e){}
  restoreState();restoreDrafts();
  const ret=readAuthHash();
  // 구글에 다녀오려다 돌아오지 못한 흔적이 있으면(오류 화면 등) 자동으로는 다시 보내지 않는다
  const pend=LS.get('authState');
  if(pend&&!ret){LS.del('authState');if(pend.silent){LS.set('needLogin','noreturn');logAuth('redirect',false,'noreturn')}}
  AUTH.st=tokenValid()?'ok':LS.get('hadLogin')?(navigator.onLine?'renew':'off'):'none';
  // 숨은 창이 막혀 '다녀오는 방식'으로만 연장되는 기기는 화면을 그리기 전에 바로 다녀온다
  if(AUTH.st==='renew'&&LS.get('silentMode')==='redirect'&&canBounce()&&!(ret&&ret.error)){startAuth(true);return}
  if(ret&&ret.error){if(!ret.silent)LS.set('bounceAt',Date.now());if(AUTH.st==='renew'){AUTH.st='need';AUTH.err=ret.error}}
  if('serviceWorker' in navigator){
    navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.t==='d27-update')onUpdate()});
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
  let loaded=false;
  const cl=cacheLoad().catch(()=>{}).then(()=>{loaded=true});
  Promise.race([cl,sleep(1500)]).then(async()=>{
    booted=true;render();
    if(!loaded)cl.then(()=>{dropRows();render()});
    if(ret&&ret.error&&!ret.silent)toast(ret.error==='access_denied'?'로그인을 취소했습니다.':'로그인하지 못했습니다. ('+ret.error+')');
    if(await connect()){
      lastForce=Date.now();ensure(true);learnHint();
      // '다녀오는 방식'인 기기도 하루에 한 번은 숨은 창 방식이 되는지 다시 확인한다
      if(LS.get('silentMode')==='redirect'&&Date.now()-(LS.get('frameTestAt')||0)>864e5){LS.set('frameTestAt',Date.now());renew()}
    }
    setTimeout(checkUpdate,1500);
  });
}
/* 상태 확인용(토큰·계정 주소는 내보내지 않는다) */
window.__d27={ver:APP_VER,build:BUILD,state(){const t=LS.get('token');return {st:AUTH.st,err:AUTH.err,mode:LS.get('silentMode')||'',hint:!!LS.get('hint'),need:LS.get('needLogin')||'',left:t?Math.round((t.exp-Date.now())/1000):0,ev:EV.size,tabs:Object.keys(TBL).length,upd:UPD,log:(LS.get('authLog')||[]).map(x=>[x[1],x[2],x[3]||1])}}};
boot();
})();
</script>
